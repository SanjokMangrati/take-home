services:
  db:
    image: postgres:18
    environment:
      POSTGRES_USER: checker
      POSTGRES_PASSWORD: checker
      POSTGRES_DB: checker
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U checker -d checker"]
      interval: 2s
      timeout: 5s
      retries: 15

  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://checker:checker@db:5432/checker
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db-data:
